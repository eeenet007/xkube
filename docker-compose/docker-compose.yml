services:
  mysql:
    image: crpi-44hgz4440mgo9lnt.cn-guangzhou.personal.cr.aliyuncs.com/eeenet/mysql:8.0
    container_name: mysql_server
    environment:
      MYSQL_ROOT_PASSWORD: xkube_DB_123456
      MYSQL_DATABASE: db_xkube
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_general_ci 
    healthcheck:
      test: ["CMD", "mysql" ,"-uroot", "-h", "127.0.0.1","-pxkube_DB_123456","-e","select 1"]
      interval: 10s
      timeout: 10s
      retries: 3
    ports:
      - "23306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./xkube.sql:/docker-entrypoint-initdb.d/xkube.sql
    restart: always
    networks:
      - app_network

  redis:
    image: crpi-44hgz4440mgo9lnt.cn-guangzhou.personal.cr.aliyuncs.com/eeenet/redis:7.4.5-alpine3.21 
    container_name: redis_server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    command: redis-server --requirepass Redis_123456
    ports:
      - "26379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - app_network

  myapp:
    image: crpi-44hgz4440mgo9lnt.cn-guangzhou.personal.cr.aliyuncs.com/eeenet/xkube:3.6
    container_name: xkube_admin
    healthcheck:
      test: ["CMD","curl","-f","http://127.0.0.1:8080/public/check"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: "mysql://root:xkube_DB_123456@mysql_server:3306/db_xkube"
      REDIS_URL: "redis://:Redis_123456@redis_server:6379"
    networks:
      - app_network

volumes:
  mysql_data:
  redis_data:

networks:
  app_network:
    driver: bridge
