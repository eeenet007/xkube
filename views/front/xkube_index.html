<script src="/lib/layui-v2.13.3/layui.js" charset="utf-8"></script>
<script src="/js/lay-config.js?v=2.0.0" charset="utf-8"></script>
<script>
//设置默认集群
SetDefaultCluster();
    
    layui.use(['jquery', 'layer','form','miniAdmin','miniTab'], function () {
        var $ = layui.jquery,
            layer = layui.layer,
            form = layui.form,
            //miniTongji = layui.miniTongji,
            miniTab = layui.miniTab,
            miniAdmin = layui.miniAdmin;

        miniTab.listen();

        $("#close-icon").hide();
        document.querySelector('.layui-icon-close').addEventListener('click', function() {
          var input = this.previousElementSibling; // 获取输入框元素
          if (input) {
            input.value = ''; // 清空输入框内容       
          }
          $("#close-icon").hide();
        });
  
        $(".fa-trash-o").mouseover(function() {
          layer.tips('清理缓存', this, {
            tips: [1, "#000"],
            time:2000
          });
        });
        
        $(".fa-refresh").mouseover(function() {
          layer.tips('刷新页面', this, {
            tips: [1, "#000"],
            time:2000
          });
        });

        //$("#ai-chat-float").mouseover(function() {
        //  layer.tips('AI运维助手', this, {
        //    tips: [1, "#000"],
        //    time:2000
        //  });
        //});        
  
        $("input").keyup(function(){
              if( $(this).val().length > 0){
                  $("#close-icon").show();
              }else{
                  $("#close-icon").hide();
              }
          });
        /*监听输入框聚焦事件*/
        $("input").on("focus",function () {
              if( $(this).val().length > 0){
                  $("#close-icon").show();
              }else{
                  $("#close-icon").hide();
              }
        })
        /*输入框失去焦点的blur事件
          $("input").on("blur",function () {
              $("#close-icon").hide();
          });
  
          $(".layui-icon-close").on("mousedown",function(e) {
              e.preventDefault();
          })
  
          $(".delete-icon").on("click",function () {
            $(this).prev("input").val("").focus();
          });
        */

        $('#appDown').on("click",function(){
            var index = layer.open({
                title: 'APP下载',
                type: 2,
                shade: 0.2,
                maxmin:true,
                shadeClose: true,
                area: ['60%', '70%'],
                content: '/page/appDown.html',
            });
            $(window).on("resize", function () {
                layer.full(index);
            });
            return false;
        });

        $('#search').on("click",function(){
            var searchKey = $('input[name="searchKey"]').val()
            if ( searchKey != "" ) {
                 miniTab.openNewTabByIframe({
                      href:"page/search.html?keyword="+searchKey,
                      title:"搜索",
                  });
            }
        });

        // AI对话框功能
        $('#ai-chat-float').on('click', function() {
            var aiChatIndex = layer.open({
                title: 'AI助手',
                type: 2,
                shade: 0.2,
                maxmin: true,
                shadeClose: true,
                area: ['700px', '600px'],
                content: '/page/xkube/aiChat.html',
                zIndex: 10000
            });
        });

        var options = {
            iniUrl: 'api/init.json',    // 初始化接口api/init.json?v=1,
            clearUrl: "/public/cache/Clear", // 缓存清理接口
            urlHashLocation: true,      // 是否打开hash定位
            bgColorDefault: false,      // 主题默认配置
            multiModule: true,          // 是否开启多模块
            menuChildOpen: false,       // 是否默认展开菜单
            loadingTime: 0,             // 初始化加载时间
            pageAnim: true,             // iframe窗口动画
            maxTabNum: 20,              // 最大的tab打开数量
        };
        miniAdmin.render(options);

        //$('.login-out').on("click", function () {
        //    layer.msg('退出登录成功', function () {
        //        window.location = 'page/login.html';
        //    });
        //});
    });
</script>
