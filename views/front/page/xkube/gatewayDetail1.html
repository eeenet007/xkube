<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>gateway详情</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/lib/layui-v2.13.3/css/layui.css" media="all">
    <link rel="stylesheet" href="/css/public.css" media="all">
    <script src="/lib/layui-v2.13.3/layui.js" charset="utf-8"></script>
    <script src="/js/lay-config.js?v=1.0.4" charset="utf-8"></script>
    <script src="/js/xkube.js?v=1" charset="utf-8"></script>

</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">
                  <button class="layui-btn" id="EditYamlBtn">yaml编辑</button>
                  <br><br>
            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 10px;">
                <legend>元数据</legend>
            </fieldset>  
              <blockquote class="layui-elem-quote layui-quote-nm">
                  <table class="layui-table" lay-even="" lay-size="lm">
                    <colgroup>
                      <col width="150">
                      <col width="400">
                      <col width="150">
                      <col>
                    </colgroup>
                    <tbody>
                      <tr>
                        <td>名称:</td>
                        <td><div id="gatewayName"></div></td>
                        <td>创建时间:</td>
                        <td><div id="createTime"></div></td>
                      </tr>
                      <tr>
                        <td>命名空间:</td>
                        <td><div id="nameSpace"></div></td>
                        <td>网关类:</td>
                        <td><div id="gatewayClassName"></div></td>
                      </tr>
                      <tr>
                        <td>地址:</td>
                        <td><div id="address"></div></td>
                        <td>程序化状态:</td>
                        <td><div id="programmed"></div></td>
                      </tr>
                      <tr>
                        <td>附加路由数:</td>
                        <td><div id="attachedRoutes"></div></td>
                        <td></td>
                        <td></td>
                      </tr>
                    </tbody>
                  </table> 
              </blockquote> 

            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
                <legend>监听器信息</legend>
            </fieldset>            
            <div id="listenersContainer"></div>

            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
                <legend>监听状态</legend>
            </fieldset>            
            <table class="layui-table" id="conditionsTableId" lay-filter="conditionsTableFilter"></table>

            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
                <legend>状态信息</legend>
            </fieldset>            
            <div id="conditionsContainer"></div>
    </div>
</div>
</body>
<script type="text/html" id="supportKindTpl">
    {{# if (d.supportedKinds != "") { }}
            {{# layui.each(d.supportedKinds.split(','), function(index, item){ }}
                {{# if(index == 0) { }}
                        <span>{{ item }}</span>
                {{# }else{ }}
                        <br><span>{{ item }}</span>
                {{# } }}  
            {{# });  }}
    {{# }else{  }}
            <span></span>
    {{# } }}
</script>	

<script type="text/html" id="statusListenerTableBar">
    <a class="layui-btn layui-btn-normal layui-btn-sm" lay-event="viewStatusListenerInfo">查看监听状态信息</a>
</script>

<script>
    layui.use(['form', 'table','miniTab'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;
            //miniTab = layui.miniTab,
            //miniTab.listen();

        var gatewayName = getQueryString("gatewayName");
        var nameSpace = getQueryString("nameSpace");

        $('#EditYamlBtn').on("click",function(){
                layer.open({
                    title: 'yaml',
                    type: 2,
                    shade: 0.2,
                    maxmin:true,
                    shadeClose: true,
                    area: ['45%', '92%'],
                    content: '/page/xkube/gatewayYaml.html'+location.search,
                });
        });

        //detail详细
        $.get('/xkube/gateway/v1/Detail' + location.search, function (resp) {
  				  if (resp.code == 0 && resp.data.gatewayName != '' ) {
                var data = resp.data;
                
                //基本信息
                $('#gatewayName').html(data.gatewayName);
                $('#nameSpace').html(data.nameSpace);
                $('#gatewayClassName').html(data.gatewayClassName);
                $('#address').html(data.address);
                $('#programmed').html(data.programmed);
                $('#attachedRoutes').html(data.attachedRoutes);
                $('#createTime').html(data.createTime);

                // 监听器信息
                var listenersHtml = '<table class="layui-table" lay-even="" lay-size="lm">' +
                    '<thead>' +
                    '<tr>' +
                    '<th>名称</th>' +
                    '<th>协议</th>' +
                    '<th>端口</th>' +
                    '<th>允许路由</th>' +
                    '<th>域名</th>' +
                    '<th>TLS</th>' +
                    '</tr>' +
                    '</thead>' +
                    '<tbody>';
                    
                if (data.listeners && data.listeners.length > 0) {
                    for (var i = 0; i < data.listeners.length; i++) {
                        var listener = data.listeners[i];
                        listenersHtml += '<tr>' +
                            '<td>' + listener.name + '</td>' +
                            '<td>' + listener.protocol + '</td>' +
                            '<td>' + listener.port + '</td>' +
                            '<td>' + listener.allowedRoutes + '</td>' +
                            '<td>' + listener.hostName + '</td>' +
                            '<td>' + listener.tls + '</td>' +
                            '</tr>';
                    }
                } else {
                    listenersHtml += '<tr><td colspan="3">暂无监听器信息</td></tr>';
                }
                
                listenersHtml += '</tbody></table>';
                $('#listenersContainer').html(listenersHtml);

                // 监听状态
                table.render({
                    elem: '#conditionsTableId',
                    cols: [[
                        {field: 'listenersName',title: '监听名称'},
                        {field: 'attachedRoutes',title: '路由数'},
                        {field: 'supportedKinds',minWidth:200, title: '支持类型',templet: '#supportKindTpl'},      
                        {title: '操作', minWidth:80, toolbar: '#statusListenerTableBar', align: "center"}
                    ]],
                    data: data.statusListener,
                    even: true
                });
                
                // 条件信息
                var conditionsHtml = '<table class="layui-table" lay-even="" lay-size="lm">' +
                    '<thead>' +
                    '<tr>' +
                    '<th>类型</th>' +
                    '<th>状态</th>' +
                    '<th>原因</th>' +
                    '<th>消息</th>' +
                    '<th>最后转换时间</th>' +
                    '</tr>' +
                    '</thead>' +
                    '<tbody>';
                    
                if (data.conditions && data.conditions.length > 0) {
                    for (var i = 0; i < data.conditions.length; i++) {
                        var condition = data.conditions[i];
                        conditionsHtml += '<tr>' +
                            '<td>' + condition.type + '</td>' +
                            '<td>' + condition.status + '</td>' +
                            '<td>' + (condition.reason || '') + '</td>' +
                            '<td>' + (condition.message || '') + '</td>' +
                            '<td>' + (condition.lastTransitionTime || '') + '</td>' +
                            '</tr>';
                    }
                } else {
                    conditionsHtml += '<tr><td colspan="5">暂无条件信息</td></tr>';
                }
                
                conditionsHtml += '</tbody></table>';
                $('#conditionsContainer').html(conditionsHtml);
                
                // 渲染表格
                layui.table.init();
            }else{
              layer.msg('请重新刷新',{icon:2});
            }
		    });
    });
</script>
</html>
