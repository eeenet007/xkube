<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Tls设置</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/lib/layui-v2.13.3/css/layui.css" media="all">
    <link rel="stylesheet" href="/css/public.css" media="all">
    <script type="text/javascript" src="/js/jquery.min.js"></script>
    <script src="/lib/layui-v2.13.3/layui.js" charset="utf-8"></script>
    <script src="/js/xkube.js?v=1" charset="utf-8"></script>
    <style>
        body {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
<div class="layuimini-container">
        <blockquote class="layui-elem-quote layui-text">
            <a class="layui-btn" style="float:right" href="javascript:location.reload();" title="刷新">
              <i class="layui-icon">&#xe669;</i></a>
            按钮提示：<br>
            1.<button class="layui-btn layui-btn-warm layui-btn-xs"><i class="layui-icon layui-icon-reduce-circle"></i></button>:删除该证书配置<br>
            2.<button class="layui-btn layui-btn-normal layui-btn-xs"><i class="layui-icon layui-icon-add-circle"></i></button>:添加新的证书配置<br>
            3.点击删除只是临时删除,只有在点击确认修改以后才会正式生效
        </blockquote>
    <div class="layuimini-main">
        <form class="layui-form layui-form-pane" action="" lay-filter="UpdateInfo">
            <fieldset class="layui-elem-field layui-field-title">
                <legend>证书配置</legend>
            </fieldset>
            <div class="envTpl"></div>

            <div class="layui-form-item">
                <div class="layui-input-inline" style="margin-top:6px">  
                    <button class="layui-btn layui-btn-normal layui-btn-xs" id="newaddbtn"><i class="layui-icon layui-icon-add-circle"></i></button>
                </div> 
            </div> 
            <br>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn layui-btn-normal" lay-submit lay-filter="saveBtn">确认修改</button>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
<script>

    //标签删除
    var TplIndex = 0;
    function delTpl(id) {
        layer.confirm('确定删除该TLS设置?', {
            icon: 3, 
            title: '提示'
        }, function(index) {
            TplIndex--;
            $("#tpl-"+id).remove();         
            layer.close(index);
        });
    }

var clusterId = getQueryString("clusterId");
if (clusterId == null) {
	clusterId = getCookie("clusterId")
}

var Apiver = "v1";
var clusterIdVersion = getCookie(clusterId);
if ( compareVersions("1.20.1",clusterIdVersion) == 1 ) {
  Apiver = "v1beta1";
}

    layui.use(['form'], function () {
        var form = layui.form,
            layer = layui.layer,
            $ = layui.$;

			$.get('/xkube/ing/'+Apiver+'/GetTlsHost' + location.search, function (resp) {
  				if (resp.code == 0 ) {
          		$.each(resp.data,function(i,item){
                    TplIndex++;
                    //console.log(TplIndex);
                    item.hosts = item.hosts.toString().replace(/,/g, '\n');
                    var addTpl =
                        '<blockquote class="layui-elem-quote" id="tpl-'+TplIndex+'">' +
                          '<div class="layui-form-item">' +
                              '<label class="layui-form-label">证书</label>' +
                              '<div class="layui-input-inline" style="width:400px">' +
                    	              '<input type="text" name="tlsName[]" value="'+item.tls+'" class="layui-input">' +
                              '</div>' +    
                              '<div class="layui-input-inline" style="margin-top:6px">' +  
                                  '<input class="layui-btn layui-btn-warm layui-btn-xs layui-icon" type="button" id="newDelbtn" value="&#xe616;" onclick="delTpl('+TplIndex+');" />' +
                              '</div>' +                
                          '</div>' +  
                          '<div class="layui-form-item">' +
                              '<label class="layui-form-label">域名</label>' +
                              '<div class="layui-input-block">' +
                    	              '<textarea name="hosts[]" class="layui-textarea" style="width:400px;">'+item.hosts+'</textarea>' +
                              '</div>' +                  
                          '</div>' + 
                        '</blockquote>'    
                      $('.envTpl').append(addTpl);  
          		});    
          	 form.render();   
          }else{
            layer.msg(resp.msg,{icon:2});
          }
		  });

        //labes add
        $('#newaddbtn').on("click",function(){
          TplIndex++;
          console.log(TplIndex);
          var addTpl =
                  '<blockquote class="layui-elem-quote" id="tpl-'+TplIndex+'">' +
                    '<div class="layui-form-item">' +
                        '<label class="layui-form-label">证书</label>' +
                        '<div class="layui-input-inline" style="width:400px">' +
              	              '<input type="text" name="tlsName[]" value="" class="layui-input">' +
                        '</div>' +    
                        '<div class="layui-input-inline" style="margin-top:6px">' +  
                            '<input class="layui-btn layui-btn-warm layui-btn-xs layui-icon" type="button" id="newDelbtn" value="&#xe616;" onclick="delTpl('+TplIndex+');" />' +
                        '</div>' +                
                    '</div>' +  
                    '<div class="layui-form-item">' +
                        '<label class="layui-form-label">域名</label>' +
                        '<div class="layui-input-block">' +
              	              '<textarea name="hosts[]" class="layui-textarea" placeholder="一个域名一行" style="width:400px"></textarea>' +
                        '</div>' +                  
                    '</div>' + 
                  '</blockquote>' 
            $('.envTpl').append(addTpl);   
          form.render(); 
          return false;   
        });

        //监听提交
        form.on('submit(saveBtn)', function (data) {
                console.log(data.field);
			          layer.confirm('确定修改?', {icon: 3, title:'提示',yes: function(index){
                     var index2 = layer.load(0, {shade: false});
                     layer.msg('稍等片刻');
                     $.ajax({
                       url: "/xkube/ing/"+Apiver+"/UpdateTlsHost" + location.search,
                       type: "post",
                       data: JSON.stringify(data.field),
                       dataType: "json",
                       success: function (resp) {
                                layer.close(index2);
                                 if(resp.code == 0){
                                    layer.msg('修改成功', {icon: 1});
									                  //window.location.reload();
                                 }else{
                                    layer.msg(resp.msg,{icon:2});
                                 }
                        }
                      });		  	  
                  },
                  cancel: function(index, layero){ 
                    layer.close(index);
                    layer.close(index2);
		                console.log("不操作");
                  } 
                });
              return false;
        });

    });
</script>
</html>
