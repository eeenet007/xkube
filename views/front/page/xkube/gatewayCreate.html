<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>创建</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/lib/layui-v2.13.3/css/layui.css" media="all">
    <link rel="stylesheet" href="/css/public.css" media="all">
    <script type="text/javascript" src="/js/jquery.min.js"></script>
    <script src="/lib/layui-v2.13.3/layui.js" charset="utf-8"></script>
    <script src="/js/xkube.js?v=1" charset="utf-8"></script>
    <style>
        body {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
<div class="layuimini-container">
        <blockquote class="layui-elem-quote layui-text">
            <a class="layui-btn" style="float:right" href="javascript:location.reload();" title="刷新">
              <i class="layui-icon">&#xe669;</i></a>
            提示：
        </blockquote>
    <div class="layuimini-main">
        <form class="layui-form layui-form-pane" action="">
            <input type="hidden" name="labels" readonly="true" value="" class="layui-input" disabled>
            <input type="hidden" name="listeners" readonly="true" value="" class="layui-input" disabled>
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">当前集群</label>
                    <div class="layui-input-inline">
                        <select name="clusterId" lay-filter="cluster_Id" lay-search="" id="cluster_Id">
                          <option value="">请选择集群</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label required">网关名称</label>
                <div class="layui-input-inline" style="width:400px">  
                    <input type="text" name="gatewayName" placeholder="网关名称" lay-verify="required" lay-reqtext="不能为空" value="" class="layui-input">
                </div> 
                <div class="layui-form-mid layui-word-aux"><span style="color:red">*</span></div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">命名空间</label>
                <div class="layui-input-inline" style="width:140px">
                  <select name="nameSpace" lay-filter="name_Space" lay-search="" id="name_Space">
                  </select>
                </div>
                <label class="layui-form-label required">网关控制器</label>
                <div class="layui-input-inline" style="width:140px">
                  <select name="gatewayClassName" lay-filter="gatewayClassName" lay-search="" id="gatewayClassName">
                  </select>
                </div>
                <div class="layui-form-mid layui-word-aux"><span style="color:red">*</span></div>
            </div>

            <div class="listenersTpl">
                <div class="layui-form-item">
                    <label class="layui-form-label">监听器</label>
                    <div class="layui-input-inline" style="width:140px">  
                        <input type="text" id="listener_name0" name="listener_name[]" placeholder="名称" value="" class="layui-input">
                    </div>
                    <div class="layui-input-inline" style="width:150px">  
                        <select name="protocol[]" id="protocol0">
                    			<option value="HTTP">HTTP</option>
                    			<option value="HTTPS">HTTPS</option>
                    			<option value="TCP">TCP</option>
                    			<option value="UDP">UDP</option>
        		            </select>
                    </div>
                    <div class="layui-input-inline" style="width:90px">  
                        <input type="text" id="port0" name="port[]" placeholder="端口" value="" class="layui-input">
                    </div>
                    <div class="layui-input-inline" style="margin-top:6px">  
                        <button class="layui-btn layui-btn-normal layui-btn-xs" id="listenerAddBtn"><i class="layui-icon layui-icon-add-circle"></i></button>
                    </div>          
                </div> 
            </div> 

            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
                <legend>标签与注解</legend>
            </fieldset>
            <div class="labelsTpl">
              <div class="layui-form-item">
                  <label class="layui-form-label">标签</label>
                  <div class="layui-input-inline" style="width:195px">  
                      <input type="text" id="labels_key0" name="labels_key[]" placeholder="key" value="" class="layui-input">
                  </div>
                  <div class="layui-input-inline" style="width:195px">  
                      <input type="text" id="labels_value0" name="labels_value[]" placeholder="value" value="" class="layui-input">
                  </div>
                  <div class="layui-input-inline" style="margin-top:6px">  
                      <button class="layui-btn layui-btn-normal layui-btn-xs" id="newaddbtn"><i class="layui-icon layui-icon-add-circle"></i></button>
                  </div>                
              </div> 
            </div>

  <br>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn layui-btn-normal" lay-submit lay-filter="saveBtn">确认保存</button>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
<script type="text/javascript">
    	$(document).ready(function(){
          GetCurrClusterId();  
          GetNamespace();	
    	});		
</script>
<script>
    //标签删除
    var TplIndex = 0;
    function delTpl(id) {
      TplIndex--;
      $("#tpl-"+id).remove();
    }
    //监听器删除
    var listenerIndex = 0;
    function delListenerTpl(id) {
      listenerIndex--;
      $("#listener-tpl-"+id).remove();
    }

var clusterId = getQueryString("clusterId");
if (clusterId == null) {
	clusterId = getCookie("clusterId")
}

	if(clusterId != "") {
		$.get('/xkube/gatewayclass/v1/List?clusterId='+clusterId, function (resp) {
			$.each(resp.data,function(i,item){
					var html = '<option value="'+item.gatewayClassName+'">'+item.gatewayClassName+'</option>'
				$("#gatewayClassName").append(html);
			});
		    layui.use('form', function(){
		        var form = layui.form;
					  form.render('');
		    });					
	    });				
	}

    layui.use(['form'], function () {
        var form = layui.form,
            layer = layui.layer,
            $ = layui.$;

        //选择集群
        form.on('select(cluster_Id)', function(data){
          setCookie('clusterId',data.value,30);
          window.location.reload();
        });

        //labels add
        $('#newaddbtn').on("click",function(){
          TplIndex++;
          var addTpl =
              '<div class="layui-form-item" id="tpl-'+TplIndex+'">' +
                  '<label class="layui-form-label">标签</label>' +
                  '<div class="layui-input-inline" style="width:195px">' +
        	              '<input type="text" name="labels_key[]" id="labels_key'+TplIndex+'" placeholder="key" value="" class="layui-input">' +
                  '</div>' +    
                  '<div class="layui-input-inline" style="width:195px">' +  
                      '<input type="text" name="labels_value[]" id="labels_value'+TplIndex+'" placeholder="value" value="" class="layui-input">' +
                  '</div>' +
                  '<div class="layui-input-inline" style="margin-top:6px">' +  
                      '<input class="layui-btn layui-btn-normal layui-btn-xs layui-bg-orange layui-icon" type="button" id="newDelbtn" value="&#xe616;" onclick="delTpl('+TplIndex+');" />' +
                  '</div>' +                
              '</div>'
            $('.labelsTpl').append(addTpl);   
          form.render(); 
          return false;   
        });

        //监听器增加
        $('#listenerAddBtn').on("click",function(){
          listenerIndex++;
          var protocolId = "protocol" + listenerIndex;
          var addTpl =
                '<div class="layui-form-item" id="listener-tpl-'+listenerIndex+'">' +
                    '<label class="layui-form-label">监听器</label>' +  
                    '<div class="layui-input-inline" style="width:140px">' +  
                        '<input type="text" name="listener_name[]" id="listener_name'+listenerIndex+'" placeholder="名称" value="" class="layui-input">' +
                    '</div>' +
                    '<div class="layui-input-inline" style="width:150px">' +  
                        '<select name="protocol[]" id="' + protocolId + '">' +  
                    			'<option value="HTTP">HTTP</option>' +  
                    			'<option value="HTTPS">HTTPS</option>' +   
                    			'<option value="TCP">TCP</option>' +  
                    			'<option value="UDP">UDP</option>' +  
        		            '</select>' +  
                    '</div>' +
                    '<div class="layui-input-inline" style="width:90px">' +  
                        '<input type="text" name="port[]" id="port'+listenerIndex+'" placeholder="端口" value="" class="layui-input">' +
                    '</div>' +   
                    '<div class="layui-input-inline" style="margin-top:6px">' +  
                        '<input class="layui-btn layui-btn-normal layui-bg-orange layui-btn-xs layui-icon" type="button" id="newDelbtn" value="&#xe616;" onclick="delListenerTpl('+listenerIndex+');" />' +
                    '</div>' +              
                '</div>' 
            $('.listenersTpl').append(addTpl);   
          form.render(); 
          return false;   
        });

        //监听提交
        form.on('submit(saveBtn)', function (data) {
                data.field.gatewayName = data.field.gatewayName.replace(/^\s*|\s*$/g,""); //替换空格
                
                //labels 处理
                var labelsArry = [];
                for (var i=0;i<=TplIndex;i++) {
                  var kk = document.getElementById("labels_key"+i).value;
                  var vv = document.getElementById("labels_value"+i).value; 
                  if ( kk != "" && vv != "") {
                    labelsArry.push(
                      {
                        key:kk,
                        value:vv,
                      }
                    )
                  }
                }
                if (labelsArry.length > 0) {
                  data.field.labels = labelsArry;
                }

                //监听器处理
                var listenersArry = [];
                for (var i=0;i<=listenerIndex;i++) {
                  var name = document.getElementById("listener_name"+i).value; 
                  var protocol = document.getElementById("protocol"+i).value; 
                  var port = document.getElementById("port"+i).value; 
                  if (name != "" && protocol != "" && port != "") {
                    listenersArry.push(
                      {
                        name: name,
                        protocol: protocol,
                        port: port
                      }
                    )
                  }
                }
                if (listenersArry.length > 0) {
                  data.field.listeners = listenersArry;
                }
                    
			          layer.confirm('确定添加?', {icon: 3, title:'提示',yes: function(index){
                     var index2 = layer.load(0, {shade: false});
                     console.log(data.field);
                     layer.msg('稍等片刻');
                     $.ajax({
                       url: "/xkube/gateway/v1/Create?clusterId="+clusterId,
                       type: "post",
                       data: JSON.stringify(data.field),
                       dataType: "json",
                       success: function (resp) {
                                layer.close(index2);
                                 if(resp.code == 0){
                                    layer.msg('添加成功', {icon: 1});
								                //window.location.reload();
                                 }else{
                                    layer.msg(resp.msg,{icon:2});
                                 }
                        }
                      });		  	  
                  },
                  cancel: function(index, layero){ 
                    layer.close(index);
                    layer.close(index2);
		                console.log("不操作");
                  } 
                });
              return false;
        });

    });
</script>
</html>
