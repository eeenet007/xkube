<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AI助手</title>
    <link rel="stylesheet" href="/lib/layui-v2.13.3/css/layui.css" media="all">
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 15px;
            background-color: white;
            box-sizing: border-box;
            padding-bottom: 80px; /* 为底部按钮留出额外空间 */
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .chat-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
            background-color: #fafafa;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.bot {
            justify-content: flex-start;
        }
        .message-content {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            line-height: 1.5;
        }
        .message.user .message-content {
            background-color: #1e9fff;
            color: white;
            border-bottom-right-radius: 5px;
        }
        .message.bot .message-content {
            background-color: #f1f0f0;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        .input-area {
            display: flex;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        .input-area .layui-input {
            flex: 1;
            margin-right: 10px;
        }
        .input-area .layui-btn {
            margin-left: 5px;
        }
        .button-bar {
            display: flex;
            justify-content: flex-end;
            padding: 15px 15px 20px;
            margin-top: 10px;
            border-top: 1px solid #eee;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: white;
            z-index: 10;
        }
        .control-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
        }
        .model-selector {
            width: 200px;
        }
        .markdown-content {
            line-height: 1.6;
        }
        .markdown-content h1, 
        .markdown-content h2, 
        .markdown-content h3 {
            margin: 10px 0;
        }
        .markdown-content p {
            margin: 10px 0;
        }
        .markdown-content ul, 
        .markdown-content ol {
            margin: 10px 0;
            padding-left: 20px;
        }
        .markdown-content li {
            margin: 5px 0;
        }
        .markdown-content code {
            background-color: #f0f0f0;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }
        .markdown-content pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow: auto;
        }
        .markdown-content pre code {
            background: none;
            padding: 0;
        }
        .typing-indicator {
            display: none;
            padding: 10px 15px;
            background-color: #f1f0f0;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="control-bar">
            <div class="model-selector">
                <select name="model" id="model-select" lay-filter="model-select" class="layui-input">
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                    <option value="gpt-4">GPT-4</option>
                    <option value="claude-3">Claude 3</option>
                    <option value="gemini-pro">Gemini Pro</option>
                    <option value="qwen-max">通义千问Max</option>
                    <option value="qwen-plus">通义千问Plus</option>
                </select>
            </div>
            <div>
                <button class="layui-btn layui-btn-primary" id="new-session">新建会话</button>
            </div>
        </div>
        
        <div class="chat-content" id="chat-content">
            <div class="message bot">
                <div class="message-content markdown-content">
                    <p>你好！我是AI助手，有什么可以帮助你的吗？</p>
                    <p>我可以帮助你：</p>
                    <ul>
                        <li>解答Kubernetes相关问题</li>
                        <li>解释YAML配置文件</li>
                        <li>提供运维建议</li>
                        <li>回答技术问题</li>
                    </ul>
                </div>
            </div>
            <div class="typing-indicator" id="typing-indicator">
                AI正在思考中...
            </div>
        </div>
        
        <div class="input-area">
            <textarea name="text" class="layui-textarea" id="message-input" placeholder="输入消息... (按Ctrl+Enter发送)" style="resize: none; height: 80px;"></textarea>
        </div>
    </div>
    
    <div class="button-bar">
        <button class="layui-btn" id="send-btn">发送</button>
        <button class="layui-btn layui-btn-primary" id="clear-btn">清空</button>
    </div>

    <script src="/lib/layui-v2.13.3/layui.js" charset="utf-8"></script>
    <script src="/js/jquery.min.js" charset="utf-8"></script>
    <script src="/js/marked.min.js"></script>
    
    <script>
        layui.use(['form', 'element'], function() {
            var form = layui.form;
            var element = layui.element;
            var $ = layui.jquery;
            
            // 模拟AI对话数据
            let conversationHistory = [];
            
            // 初始化marked.js
            marked.setOptions({
                breaks: true,
                gfm: true,
                highlight: function(code, lang) {
                    return code;
                }
            });
            
            // 发送消息
            function sendMessage() {
                const message = $('#message-input').val().trim();
                const selectedModel = $('#model-select').val();
                
                if (!message) {
                    layer.msg('请输入消息内容', {icon: 2});
                    return;
                }
                
                // 添加用户消息到对话
                addMessageToChat('user', message);
                
                // 清空输入框
                $('#message-input').val('');
                
                // 显示打字指示器
                $('#typing-indicator').show();
                
                // 模拟AI响应（实际应用中这里应该是调用API）
                setTimeout(() => {
                    // 隐藏打字指示器
                    $('#typing-indicator').hide();
                    
                    // 添加AI响应到对话
                    const response = getAIResponse(message, selectedModel);
                    addMessageToChat('bot', response);
                    
                    // 滚动到底部
                    scrollToBottom();
                }, 1000);
            }
            
            // 添加消息到聊天界面
            function addMessageToChat(role, content) {
                const chatContent = $('#chat-content');
                
                // 将Markdown转换为HTML
                const htmlContent = marked.parse(content);
                
                let messageClass = role === 'user' ? 'user' : 'bot';
                let messageDiv = `
                    <div class="message ${messageClass}">
                        <div class="message-content markdown-content">${htmlContent}</div>
                    </div>
                `;
                
                // 在打字指示器前插入消息
                $('#typing-indicator').before(messageDiv);
                
                // 滚动到底部
                scrollToBottom();
                
                // 保存到历史记录
                conversationHistory.push({role, content});
            }
            
            // 滚动到底部
            function scrollToBottom() {
                const chatContent = $('#chat-content');
                chatContent.scrollTop(chatContent[0].scrollHeight);
            }
            
            // 获取AI响应（模拟）
            function getAIResponse(userMessage, model) {
                // 这里是模拟响应，实际应用中应该调用AI API
                const lowerMsg = userMessage.toLowerCase();
                
                if (lowerMsg.includes('k8s') || lowerMsg.includes('kubernetes') || lowerMsg.includes('集群')) {
                    return `关于Kubernetes，我可以提供以下信息：
\`\`\`
## Kubernetes基础概念
- **Pod**: 最小部署单元，包含一个或多个容器
- **Servicesss**: 提供稳定的网络访问点
- **Deployment**: 管理Pod的副本和更新
- **ConfigMap/Secret**: 配置和敏感信息管理

## 常用命令
\`\`\`bash
# 查看Pods
kubectl get pods

# 查看服务
kubectl get services

# 查看部署
kubectl get deployments
\`\`\`

如需更详细的信息，请告诉我具体需要了解哪方面。`;
                } else if (lowerMsg.includes('yaml') || lowerMsg.includes('配置')) {
                    return `关于YAML配置，Kubernetes的YAML文件通常包含以下字段：

\`\`\`yaml
apiVersion: apps/v1  # API版本
kind: Deployment     # 资源类型
metadata:            # 元数据
  name: my-app       # 资源名称
  namespace: default # 命名空间
spec:                # 规格定义
  replicas: 3        # 副本数量
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: nginx:latest
        ports:
        - containerPort: 80
\`\`\`

这个YAML定义了一个包含3个副本的Deployment，使用nginx镜像。`;
                } else {
                    return `我理解您关于"${model}"的问题。这是一个模拟响应，实际应用中这里会连接真实的AI模型API。

您询问的是: "${userMessage}"

在实际部署中，我会连接到所选模型的API端点，并返回流式响应，支持Markdown格式的输出。`;
                }
            }
            
            // 新建会话
            function newSession() {
                conversationHistory = [];
                $('#chat-content').html(`
                    <div class="message bot">
                        <div class="message-content markdown-content">
                            <p>你好！新的对话会话已开始，有什么可以帮助你的吗？</p>
                            <p>我可以帮助你：</p>
                            <ul>
                                <li>解答Kubernetes相关问题</li>
                                <li>解释YAML配置文件</li>
                                <li>提供运维建议</li>
                                <li>回答技术问题</li>
                            </ul>
                        </div>
                    </div>
                    <div class="typing-indicator" id="typing-indicator">
                        AI正在思考中...
                    </div>
                `);
                layer.msg('已创建新会话', {icon: 1});
            }
            
            // 绑定事件
            $('#send-btn').on('click', sendMessage);
            
            $('#message-input').on('keydown', function(e) {
                if (e.ctrlKey && e.keyCode === 13) {
                    sendMessage();
                }
            });
            
            $('#new-session').on('click', newSession);
            
            $('#clear-btn').on('click', function() {
                $('#message-input').val('');
            });
            
            // 初始化表单
            form.render();
            
            // 初始滚动到底部
            scrollToBottom();
        });
    </script>
</body>
</html>
