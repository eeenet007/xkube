<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>pod指标top值</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/lib/layui-v2.13.3/css/layui.css" media="all">
    <link rel="stylesheet" href="/css/public.css" media="all">
    <script src="/lib/layui-v2.13.3/layui.js" charset="utf-8"></script>
    <script src="/js/xkube.js?v=1" charset="utf-8"></script>
    <script src="/js/lay-config.js?v=1.0.4" charset="utf-8"></script>
</style>
</head>
<body>
<div class="layuimini-container">
        <blockquote class="layui-elem-quote layui-text">
            <a class="layui-btn" style="float:right" href="javascript:location.reload();" title="刷新">
              <i class="layui-icon">&#xe669;</i></a>
            功能相当于：kubectl top metric -n namespace
        </blockquote>
    <div class="layuimini-main">
        <fieldset class="table-search-fieldset">
            <legend>搜索信息</legend>
            <div style="margin: 10px 10px 10px 10px">
                <form class="layui-form layui-form-pane" action="">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">排序</label>
                            <div class="layui-input-inline">
                                <input type="radio" name="sort" value="mem" title="内存" checked="">
                                <input type="radio" name="sort" value="cpu" title="CPU">
                            </div>
                        </div>

                        <div class="layui-inline">
                            <label class="layui-form-label">命名空间</label>
                            <div class="layui-input-inline">
                              <select name="nameSpace" lay-filter="name_Space" lay-search="" id="name_Space">
          	              			<option value="" selected="">所有空间</option>
              		            </select>
                            </div>
                        </div>

                        <div class="layui-inline">
                            <button type="submit" class="layui-btn"  lay-submit lay-filter="data-search-btn"><i class="layui-icon"></i> 搜 索</button>
                        </div>

                        <div class="layui-inline" style="position: absolute;right:50px">
                            <label class="layui-form-label">当前集群</label>
                            <div class="layui-input-inline">
                                <select name="clusterId" lay-filter="cluster_Id" lay-search="" id="cluster_Id">
                                  <option value="">请选择集群</option>
                                </select>
                            </div>
                        </div>
                        
                    </div>
                </form>
            </div>
        </fieldset>

        <table class="layui-table" id="currentTableId" lay-filter="currentTableFilter"></table>
    </div>
</div>

</body>
<script type="text/html" id="currentTableBar">
    {{#  var clusterId = getQueryString("clusterId"); }}
    {{#  if (clusterId == null) { }}
    {{#      clusterId = getCookie("clusterId") }}
    {{#  } }}
    <a href="javascript:;" layuimini-content-href="page/xkube/podDetail.html?clusterId={{clusterId}}&nameSpace={{d.nameSpace}}&podName={{d.podName}}" data-title="{{ d.podName }}详情" class="layui-btn layui-btn-normal layui-btn-sm">&nbsp;详情&nbsp;</a>
    <a class="layui-btn layui-btn-sm" lay-event="podResLine"><i class="layui-icon">&#xe629;</i>性&nbsp;能</a>
    <a class="layui-btn layui-btn-sm" lay-event="podLog">日志</a>
    <a class="layui-btn layui-btn-normal layui-btn-sm layui-btn-danger" lay-event="delete">删除</a>
</script>
<script>

var clusterId = getQueryString("clusterId");
if (clusterId == null) {
	clusterId = getCookie("clusterId")
}
    layui.use(['form', 'table','miniTab'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;
            miniTab = layui.miniTab,
            miniTab.listen();

            form.render();

      	$(document).ready(function(){
            GetCurrClusterId();  
            //GetNamespace();	
      	});

        //选择集群
        form.on('select(cluster_Id)', function(data){
          //console.log(data.elem); //得到select原始DOM对象
          console.log(data.value); //得到被选中的值
          setCookie('clusterId',data.value,30);
          window.location.reload();
          //console.log(data.othis); //得到美化后的DOM对象
        });

       //form.on('select(name_Space)', function(data){
       //     table.reload('currentTableId', {
       //        method:'GET',
       //         url: '/xkube/metrics/v1/PodList?clusterId='+clusterId+'&nameSpace='+data.value,
       //         contentType: 'application/json',
       //         done: function(res, curr, count){
       //         }
       //     }, 'data');
       // });

        table.render({
            elem: '#currentTableId',
            url: '/xkube/metrics/v1/PodList'+location.search+'&clusterId='+clusterId,
            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', 'exports', 'print', {
                title: '提示',
                layEvent: 'LAYTABLE_TIPS',
                icon: 'layui-icon-tips'
            }],
            parseData: function(res) { //实现加载全部数据后再分页
              if(res.code != 0){
                return {
               	  "code": res.code,
              	  "msg": res.msg,                 
                }
              }
            	if(this.page.curr) {
            		result=res.data.slice(this.limit*(this.page.curr-1),this.limit*this.page.curr);
            	}else{
            	  result=res.data.slice(0,this.limit);
              }
              return {
              	"code": res.code,
              	"msg":'',
              	"count":res.count,
              	"data":result
              };
            },
            cols: [[
                //{type: "checkbox", width: 50},
                {field: 'podName',title: '名称'}, 
                {field: 'nameSpace', title: '命名空间', sort: true},                        
                {field: 'cpu',title: 'CPU[核]',sort: true},
                {field: 'mem',title:'内存[MB]',sort: true},           
                {field: 'timestamp', title: '采集时间'},  
                {title: '操作', minWidth:320, toolbar: '#currentTableBar', align: "center"}
            ]],
            //initSort: { // 初始排序配置
            //  field: 'mem' // 指定排序的字段名
            //  ,type: 'desc' // 指定排序方式：升序或降序
            //},
            limits: [25, 50, 100, 200, 500],
            limit: 25,
            page: true
        });


        // 监听搜索操作
        form.on('submit(data-search-btn)', function (data) {
            table.reload('currentTableId', {
                page: {
                    curr: 1,
                    limit:25
                },
                method:'POST',
                url: '/xkube/metrics/v1/PodList?clusterId='+clusterId,
                contentType: 'application/json',
                where: data.field,
                done: function(res, curr, count){
                  //console.log(res);
                  //this.where={};
                  //不清空，有问题：搜索条件会保留
                  //清空，  有问题：分页的时候没有搜索条件了,分页会受到影响
                  //https://copyfuture.com/blogs-details/20200729003153292ltjtf01kvp048gr
                }
            }, 'data');
            return false;
        });

       table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data;
            if (obj.event === 'podResLine') {
                var index = layer.open({
                    title: '资源使用曲线',
                    type: 2,
                    shade: 0.2,
                    maxmin:true,
                    shadeClose: true,
                    area: ['60%', '50%'],
                    content: '/page/xkube/podCpuMemLine.html?clusterId='+clusterId+'&nameSpace='+data.nameSpace+"&podName="+data.podName,
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            }else if (obj.event === 'podLog') {
                var index = layer.open({
                    title: '日志',
                    type: 2,
                    shade: 0.2,
                    maxmin:true,
                    shadeClose: true,
                    area: ['55%', '92%'],
                    content: '/page/xkube/podLog.html?clusterId='+clusterId+'&nameSpace='+data.nameSpace+"&podName="+data.podName,
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            }else if (obj.event === 'delete') {
                layer.confirm('确定删除'+data.nameSpace+'?', {icon: 3, title:'删除提示',yes: function(index){
                     var index2 = layer.load(0, {shade: false});
                     layer.msg('此处需运行1-2s左右');
                			 $.ajax({
                			    url: '/xkube/pod/v1/Del?clusterId='+clusterId+'&nameSpace='+data.nameSpace+"&podName="+data.podName,
                			    type: "get",
                			    success: function (resp) {
                            layer.close(index2);
                						 if(resp.code == 0){
                							 layer.msg('删除成功', {icon: 1});
                							 //window.location.reload();
                							 obj.del();
                						 }else{
                							 layer.msg(resp.msg,{icon:2});
                						 }
                				  }
                		   });		  	  
                },
            		  cancel: function(index, layero){ 
            			    layer.close(index);
                      layer.close(index2);
            			    console.log("不操作");
            		  } 
        		    });                
            }
        });


    });
</script>
</html>
