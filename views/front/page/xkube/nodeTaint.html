<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>污点管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/lib/layui-v2.13.3/css/layui.css" media="all">
    <link rel="stylesheet" href="/css/public.css" media="all">
    <script type="text/javascript" src="/js/jquery.min.js"></script>
    <script src="/lib/layui-v2.13.3/layui.js" charset="utf-8"></script>
    <script src="/js/xkube.js?v=1" charset="utf-8"></script>
    <style>
        body {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
<blockquote class="layui-elem-quote layui-text">
    NoSchedule:默认值，阻止新Pod调度到此节点<br>
    PreferNoSchedule:尽量不调度新Pod到此节点<br>
    NoExecute:不仅阻止新Pod调度，而且驱逐已经存在的Pod
</blockquote>
<div class="layuimini-container">
    <div class="layuimini-main">
        <form class="layui-form layui-form-pane" action="">
            <div style="margin-left:10px">
                <div class="layui-input-inline" style="width:200px">  
                    <div class="layui-form-mid layui-word-aux">名称</div>
                </div> 
                <div class="layui-input-inline" style="width:175px">  
                    <div class="layui-form-mid layui-word-aux">Effect</div>
                </div> 
                <div class="layui-input-inline" style="width:200px">  
                    <div class="layui-form-mid layui-word-aux">值</div>
                </div> 
            </div> 
            <div class="labelsTpl"></div>
            <div class="layui-form-item">
                <div class="layui-input-inline" style="margin-top:6px">  
                    <button class="layui-btn layui-btn-normal layui-btn-xs" id="newaddbtn"><i class="layui-icon layui-icon-add-circle"></i></button>
                </div> 
            </div> 
            <br>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn layui-btn-normal" lay-submit lay-filter="saveBtn">确认修改</button>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
<script>

    //标签删除
    var TplIndex = 0;
    function delTpl(id) {
      //var TplIndex = id;
      TplIndex--;
      console.log(TplIndex);
      $("#tpl-"+id).remove();
    }

    layui.use(['form'], function () {
        var form = layui.form,
            layer = layui.layer,
            $ = layui.$;

			$.get('/xkube/node/v1/GetTaint' + location.search, function (resp) {
  				if (resp.code == 0 ) {
          		$.each(resp.data,function(i,item){
                    TplIndex++;
                    //console.log(TplIndex);
                    var pathTypeTpl = '';
                    if (item.effect == "NoSchedule") {
                        pathTypeTpl =
                            '<option value="NoSchedule" selected>NoSchedule</option>' +  
                            '<option value="NoExecute">NoExecute</option>' +  
                            '<option value="PreferNoSchedule">PreferNoSchedule</option>';
                    } else if (item.effect == "NoExecute") {
                        pathTypeTpl =
                            '<option value="NoSchedule">NoSchedule</option>' +  
                            '<option value="NoExecute" selected>NoExecute</option>' +  
                            '<option value="PreferNoSchedule">PreferNoSchedule</option>';
                    } else {
                        pathTypeTpl =
                            '<option value="NoSchedule" selected>NoSchedule</option>' +  
                            '<option value="NoExecute">NoExecute</option>' +  
                            '<option value="PreferNoSchedule">PreferNoSchedule</option>';
                    }
                    var addTpl =
                        '<div class="layui-form-item" id="tpl-'+TplIndex+'">' +
                            '<div class="layui-input-inline" style="width:200px">' +
                  	              '<input type="text" name="key[]" id="key'+TplIndex+'" placeholder="key" value="'+item.key+'" class="layui-input">' +
                            '</div>' +  
                            '<div class="layui-input-inline" style="width:175px">' +  
                                '<select name="effect[]" id="effect'+TplIndex+'">' +  
                                    pathTypeTpl +
                                '</select>' +  
                            '</div>' +  
                            '<div class="layui-input-inline" style="width:200px">' +  
                                '<input type="text" name="value[]" id="value'+TplIndex+'" placeholder="value" value="'+item.value+'" class="layui-input">' +
                            '</div>' +
                            '<div class="layui-input-inline" style="margin-top:6px">' +  
                                '<input class="layui-btn layui-btn-normal layui-bg-orange layui-btn-xs layui-icon" type="button" id="newDelbtn" value="&#xe616;" onclick="delTpl('+TplIndex+');" />' +
                            '</div>' +                
                        '</div>'
                      $('.labelsTpl').append(addTpl);  
          		});    
          	  layui.use('form', function(){
          	           var form = layui.form;
          	           form.render();
          	           //form.render('select', 'clusterId');
          	  });	        
          }else{
            layer.msg(resp.msg,{icon:2});
          }
		  });

        //labes add
        $('#newaddbtn').on("click",function(){
          TplIndex++;
          //console.log(TplIndex);
          var addTpl =
              '<div class="layui-form-item" id="tpl-'+TplIndex+'">' +
                  '<div class="layui-input-inline" style="width:200px">' +
        	              '<input type="text" name="key[]" id="key'+TplIndex+'" placeholder="key" value="" class="layui-input">' +
                  '</div>' +   
                  '<div class="layui-input-inline" style="width:175px">' +  
                      '<select name="effect[]" id="effect'+TplIndex+'">' +  
                          '<option value="NoSchedule" selected>NoSchedule</option>' +  
                          '<option value="NoExecute">NoExecute</option>' +  
                          '<option value="PreferNoSchedule">PreferNoSchedule</option>' +   
                      '</select>' +  
                  '</div>' + 
                  '<div class="layui-input-inline" style="width:200px">' +  
                      '<input type="text" name="value[]" id="value'+TplIndex+'" placeholder="value" value="" class="layui-input">' +
                  '</div>' +
                  '<div class="layui-input-inline" style="margin-top:6px">' +  
                      '<input class="layui-btn layui-btn-normal layui-bg-orange layui-btn-xs layui-icon" type="button" id="newDelbtn" value="&#xe616;" onclick="delTpl('+TplIndex+');" />' +
                  '</div>' +                
              '</div>'
            $('.labelsTpl').append(addTpl);   
          form.render(); 
          return false;   
        });

        //监听提交
        form.on('submit(saveBtn)', function (data) {
                console.log(data.field);
			          layer.confirm('确定修改?', {icon: 3, title:'提示',yes: function(index){
                     var index2 = layer.load(0, {shade: false});
                     layer.msg('稍等片刻');
                     $.ajax({
                       url: "/xkube/node/v1/UpdateTaint" + location.search,
                       type: "post",
                       data: JSON.stringify(data.field),
                       dataType: "json",
                       success: function (resp) {
                                layer.close(index2);
                                 if(resp.code == 0){
                                    layer.msg('修改成功', {icon: 1});
									                  //window.location.reload();
                                 }else{
                                    layer.msg(resp.msg,{icon:2});
                                 }
                        }
                      });		  	  
                  },
                  cancel: function(index, layero){ 
                    layer.close(index);
                    layer.close(index2);
		                console.log("不操作");
                  } 
                });
              return false;
        });

    });
</script>
</html>
