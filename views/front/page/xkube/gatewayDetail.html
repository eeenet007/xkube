<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>gateway详情</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/lib/layui-v2.13.3/css/layui.css" media="all">
    <link rel="stylesheet" href="/css/public.css" media="all">
    <script src="/lib/layui-v2.13.3/layui.js" charset="utf-8"></script>
    <script src="/js/lay-config.js?v=1.0.4" charset="utf-8"></script>
    <script src="/js/xkube.js?v=1" charset="utf-8"></script>
    <style>
    .layui-table-cell {
      height: auto;
      line-height: 22px !important;
      text-overflow: inherit;
      overflow: ellipsis;
      white-space: normal;
    }
    .layui-table-cell .layui-table-tool-panel li {
      word-break: break-word;
    }
    </style>
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">
                  <button class="layui-btn" id="EditYamlBtn">yaml编辑</button>
                  <button class="layui-btn" id="YamlBackup">yaml备份</button>
                  <button class="layui-btn layui-btn-danger" id="DelBtn">删除</button>
                  <br><br>
            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 10px;">
                <legend>元数据</legend>
            </fieldset>  
              <blockquote class="layui-elem-quote layui-quote-nm">
                  <table class="layui-table" lay-even="" lay-size="lm">
                    <colgroup>
                      <col width="150">
                      <col width="400">
                      <col width="150">
                      <col>
                    </colgroup>
                    <tbody>
                      <tr>
                        <td>名称:</td>
                        <td><div id="gatewayName"></div></td>
                        <td>创建时间:</td>
                        <td><div id="createTime"></div></td>
                      </tr>
                      <tr>
                        <td>命名空间:</td>
                        <td><div id="nameSpace"></div></td>
                        <td>网关类:</td>
                        <td><div id="gatewayClassName"></div></td>
                      </tr>
                      <tr>
                        <td>地址:</td>
                        <td><div id="address"></div></td>
                        <td>程序化状态:</td>
                        <td><div id="programmed"></div></td>
                      </tr>
                      <tr>
                        <td>附加路由数:</td>
                        <td><div id="attachedRoutes"></div></td>
                        <td></td>
                        <td></td>
                      </tr>
                    </tbody>
                  </table> 
              </blockquote> 

            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
                <legend>监听端口及路由信息</legend>
            </fieldset>            
            <table class="layui-table" id="listenersTableId" lay-filter="listenersTableFilter"></table>

            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
                <legend>监听状态查看</legend>
            </fieldset>            
            <table class="layui-table" id="listenerConditionsTableId" lay-filter="listenerConditionsTableFilter"></table>

            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
                <legend>状态信息</legend>
            </fieldset>            
            <table class="layui-table" id="conditionsTableId" lay-filter="conditionsTableFilter"></table>

    </div>
</div>
</body>
<script type="text/html" id="supportkindTpl">
    {{# if (d.supportedKinds != "" && d.supportedKinds != undefined) { }}
            {{# layui.each(d.supportedKinds.split(','), function(index, item){ }}
                {{# if(index == 0) { }}
                        <span>{{ item }}</span>
                {{# }else{ }}
                        <br><span>{{ item }}</span>
                {{# } }}  
            {{# });  }}
    {{# }else{  }}
            <span></span>
    {{# } }}
</script>	

<script type="text/html" id="supportkindTpl2">
    {{# if (d.supportedKinds != "" && d.supportedKinds != undefined) { }}
        <span>{{  d.supportedKinds.replace(/,/g, "<br>") }}</span>
    {{# }else{  }}
            <span></span>
    {{# } }}
</script>	

<script type="text/html" id="statusListenerTableBar">
    <a class="layui-btn layui-btn-normal layui-btn-sm" lay-event="viewStatusListenerInfo">查看监听状态信息</a>
</script>

<script>
    layui.use(['form', 'table','miniTab'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;
            miniTab = layui.miniTab,
            miniTab.listen();

        var gatewayName = getQueryString("gatewayName");
        var nameSpace = getQueryString("nameSpace");

        $('#EditYamlBtn').on("click",function(){
                layer.open({
                    title: 'yaml',
                    type: 2,
                    shade: 0.2,
                    maxmin:true,
                    shadeClose: true,
                    area: ['75%', '90%'],
                    content: '/page/xkube/gatewayYaml.html'+location.search,
                });
        });

        $('#YamlBackup').on("click",function(){
              miniTab.openNewTabByIframe({
                  href:'page/xkube/yamlBackup.html'+location.search+"&resType=gateway"+"&resName="+gatewayName,
                  title:gatewayName+"备份",
              }); 
        });

        $('#DelBtn').on("click",function(){
            layer.confirm('确定删除'+gatewayName+'?', {icon: 3, title:'提示',yes: function(index){
        			  $.ajax({
        			   url: "/xkube/gateway/v1/Delete"+location.search,
        			   type: "GET",
        			   success: function (resp) {
        					  if (resp.code == 0 ) {
                      layer.msg('删除成功', {icon: 1});
                    }else{
                      layer.msg(resp.msg,{icon:2});
                    }
        				  }
        		    });
              },
              cancel: function(index, layero){ 
                    layer.close(index);
              } 
            });
        });

        //监听工具条事件
        table.on('tool(listenerConditionsTableFilter)', function (obj) {
            var data = obj.data;
            if (obj.event === 'viewStatusListenerInfo') {
                // 构造条件信息表格
                var contentHtml = '<div style="padding: 20px;"><table class="layui-table">' +
                    '<colgroup>' +
                    '<col width="150">' +
                    '<col width="100">' +
                    '<col width="150">' +
                    '<col>' +
                    '<col width="150">' +
                    '</colgroup>' +
                    '<thead>' +
                    '<tr>' +
                    '<th>类型</th>' +
                    '<th>状态</th>' +
                    '<th>原因</th>' +
                    '<th>消息</th>' +
                    '<th>最后转换时间</th>' +
                    '</tr>' +
                    '</thead>' +
                    '<tbody>';
                    
                if(data.conditions && data.conditions.length > 0) {
                    for(var i = 0; i < data.conditions.length; i++) {
                        var condition = data.conditions[i];
                        contentHtml += '<tr>' +
                            '<td>' + (condition.type || '') + '</td>' +
                            '<td>' + (condition.status || '') + '</td>' +
                            '<td>' + (condition.reason || '') + '</td>' +
                            '<td>' + (condition.message || '') + '</td>' +
                            '<td>' + (condition.lastTransitionTime || '') + '</td>' +
                            '</tr>';
                    }
                } else {
                    contentHtml += '<tr><td colspan="5">暂无条件信息</td></tr>';
                }                
                contentHtml += '</tbody></table></div>';                
                layer.open({
                    type: 1,
                    title: '监听状态信息',
                    area: ['80%', '60%'],
                    content: contentHtml
                });
                return false;
            }
        });

        //detail详细
        $.get('/xkube/gateway/v1/Detail' + location.search, function (resp) {
  				  if (resp.code == 0 && resp.data.gatewayName != '' ) {
                var data = resp.data;
                
                //基本信息
                $('#gatewayName').html(data.gatewayName);
                $('#nameSpace').html(data.nameSpace);
                $('#gatewayClassName').html(data.gatewayClassName);
                $('#address').html(data.address);
                $('#programmed').html(data.programmed);
                $('#attachedRoutes').html(data.attachedRoutes);
                $('#createTime').html(data.createTime);

                // 监听器信息
                table.render({
                    elem: '#listenersTableId',
                    cols: [[
                        {field: 'name',width: 200,title: '名称'},
                        {field: 'protocol',width: 120,title: '协议'},
                        {field: 'port', width: 120,title: '端口'},  
                        {field: 'allowedRoutes', title: '允许路由'},
                        {field: 'hostName', width: 200,title: '域名'},
                        {field: 'tls', width: 200,title: 'TLS'}  
                    ]],
                    data: data.listeners,
                    even: true
                });

                // 监听状态
                table.render({
                    elem: '#listenerConditionsTableId',
                    cols: [[
                        {field: 'listenersName',width: 200,title: '监听名称'},
                        {field: 'attachedRoutes',width: 100,title: '路由数'},
                        {field: 'supportedKinds', title: '支持类型',templet: '#supportkindTpl2'},      
                        {title: '操作', width:200, toolbar: '#statusListenerTableBar', align: "center"}
                    ]],
                    data: data.statusListener,
                    even: true
                });
                
                // 条件信息
                table.render({
                    elem: '#conditionsTableId',
                    cols: [[
                        {field: 'type',width: 120,title: '类型'},
                        {field: 'status',width: 80,title: '状态'},
                        {field: 'reason',width: 120,title: '原因'},  
                        {field: 'message',title: '消息'},  
                        {field: 'lastTransitionTime',width: 160,title: '最后转换时间'}
                    ]],
                    data: data.conditions,
                    even: true
                });
            }else{
              layer.msg('请重新刷新',{icon:2});
            }
		    });
    });
</script>
</html>
