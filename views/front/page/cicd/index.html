<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>流水线</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/lib/layui-v2.13.3/css/layui.css" media="all">
    <link rel="stylesheet" href="/css/public.css" media="all">
    <script src="/js/xkube.js?v=1" charset="utf-8"></script>
    <style>
      .layui-quote-red{border-style:solid;border-color:#FF5722;border-width:1px 1px 1px 5px;background:0 0}
    </style>
</head>
<body>
<blockquote class="layui-elem-quote layui-font-red">
  注意事项：<br>
    1.目前只支持配置阿里云流水线,Jenkins流水线
</blockquote>
<div class="layuimini-container">
    <div class="layuimini-main">
        <!--
        <div id="GotoEdit" style="margin-top=300px;margin-left:25%;">
          <span class="layui-text layui-font-red layui-font-20">你还未配置<span id="cicdName"></span>流水线!!!</span><br>
          <button class="layui-btn" id="goToConfigFlow">去配置流水线</button>
        </div>
        -->
    </div>
</div>
<script src="/lib/layui-v2.13.3/layui.js" charset="utf-8"></script>
<script src="/js/lay-config.js?v=1.0.4" charset="utf-8"></script>
<script>

    layui.use(['form', 'table','miniTab'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;
            miniTab = layui.miniTab,
            miniTab.listen();

        //$("#GotoEdit").hide();

        var cicdName = getQueryString("cicdName");
        $("#cicdName").html(cicdName);


        //编辑
        //$('#goToConfigFlow').on("click",function(){
        //    miniTab.openNewTabByIframe({
        //        href:'/page/cicd/pipelines_add.html'+ location.search,
        //        title:"流水线配置",
        //    });
        //});

      //deatail
			$.get('/cicd/v1/GetCicdInfo' + location.search, function (resp) {
  				  if (resp.data.cicd_type == 1 ) { //阿里云
                //window.location.reload();
                //$("#GotoEdit").show();
                $.get('/cicd/v1/GetPipelines?cicdId=' + resp.data.id, function (res) {
                  self.location.href ='/page/cicd/pipelines_index.html'+location.search+'&cicdId='+resp.data.id+'&aliyun_id='+res.data.aliyun_id+'&organization_id='+res.data.organization_id+'&pipeline_id='+res.data.pipeline_id;
                });
            }else if (resp.data.cicd_type == 2 ) { //jenkins
                $.get('/cicd/v1/GetPipelines?cicdId=' + resp.data.id, function (res) {
                  self.location.href ='/page/cicd/jenkins_job_detail.html'+location.search+'&jksId='+res.data.jks_id+'&jobName='+res.data.pipeline_id;
                });               
            }else{
                //$("#GotoEdit").show();
                layer.msg('还未配置流水线,正在跳转到配置页!', {icon: 1},function(){
                  self.location.href ='/page/cicd/pipelines_add.html'+ location.search;
                });
            }
		  });

    });
</script>
</body>
</html>
