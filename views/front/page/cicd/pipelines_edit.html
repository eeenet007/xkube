<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>流水线详情</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/lib/layui-v2.13.3/css/layui.css" media="all">
    <link rel="stylesheet" href="/css/public.css" media="all">
    <script type="text/javascript" src="/js/jquery.min.js"></script>
    <script src="/lib/layui-v2.13.3/layui.js" charset="utf-8"></script>
    <script src="/js/xkube.js?v=1" charset="utf-8"></script>
    <script src="/js/lay-config.js?v=1.0.4" charset="utf-8"></script>
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">
        <blockquote class="layui-elem-quote layui-text">
            注意:1.添加上，流水线名称必须与deployment、sts、configmap等的资源名称一致才能关联。
            <a class="layui-btn" style="float:right" href="javascript:location.replace(location.href);" title="刷新">
              <i class="layui-icon">&#xe669;</i></a>
        </blockquote>
          <form class="layui-form layui-form-pane" action="" lay-filter="UpdateInfo">
          		<div class="layui-form-item" style="margin-bottom:2px;">
                      <div class="layui-inline">
                          <label class="layui-form-label">ID</label>
                              <div class="layui-input-inline">
                                  <input type="hide" name="id" autocomplete="off" readonly="true" placeholder="" class="layui-input">
                              </div>
                      </div>
          		</div> 
              <div class="layui-form-item" pane=""  style="width:620px;">
                  <label class="layui-form-label">流水线类型</label>
                  <div class="layui-input-block">
                      <input type="radio" name="cicd_type" value="1" lay-filter="cicdType" title="阿里云流水线" checked="">
                      <input type="radio" name="cicd_type" value="2" lay-filter="cicdType" title="jenkins">
                  </div>
              </div>  
          		<div class="layui-form-item" style="margin-bottom:2px;">
                      <div class="layui-inline">
                          <label class="layui-form-label required">名称</label>
                              <div class="layui-input-inline">
                                  <input type="text" name="cicd_name" autocomplete="off" placeholder="" class="layui-input">
                              </div>
                              <div class="layui-form-mid layui-font-red">*</div>
                      </div>
                      <div class="layui-inline">
                        <label class="layui-form-label">应用名</label>
                            <div class="layui-input-inline">
                                <input type="text" name="appname" autocomplete="off" placeholder="" class="layui-input">
                            </div>
                      </div>
          		</div>
          		<div class="layui-form-item" style="margin-bottom:2px;">
                    <div class="layui-inline">
                        <label class="layui-form-label">当前集群</label>
                        <div class="layui-input-inline">
                            <select name="cluster_id" lay-filter="cluster_Id" lay-search="" id="cluster_Id">
                              <option value="">请选择集群</option>
                            </select>
                        </div>
                        <div class="layui-form-mid layui-font-red">*</div>
                    </div>

                    <div class="layui-inline">
                        <label class="layui-form-label">命名空间</label>
                        <div class="layui-input-inline">
                          <select name="namespace" lay-filter="name_Space" lay-search="" id="name_Space">
      	              			<option value="" selected="">所有空间</option>
          		            </select>
                        </div>
                        <div class="layui-form-mid layui-font-red">* 为空时,先选k8s集群再选命名空间</div>
                    </div>
          		</div> 
<!-- aliyun flow config -->
              <div id ="aliyunTpl">     
              		<div class="layui-form-item" style="margin-bottom:2px">                                
                    			<div class="layui-inline">
            		  				    <label class="layui-form-label">阿里云帐号</label>
                                  <div class="layui-input-inline">
                    	            		<select name="aliyun_id" lay-filter="aliyunId" lay-search="" id="aliyunId">
                    	              			<option value="" selected="">请选择</option>
                    	            		</select>
                                  </div>
                                  <div class="layui-form-mid layui-font-red">*</div>
                    			</div>  
                    			<div class="layui-inline">
            		  				    <label class="layui-form-label">组织ID</label>
                                  <div class="layui-input-inline">
                    	            		<select name="organization_id" lay-filter="organizationId"  lay-search="" id="organizationId">
                    	              			<option value="" selected="">请选择</option>
                    	            		</select>
                                  </div>
                                  <div class="layui-form-mid layui-font-red">* 先选阿里云AK再选择组织ID</div>
                    			</div>
              		</div>	            
              </div>
              <div id ="jenkinsTpl">
              		<div class="layui-form-item" style="margin-bottom:2px"> 
                    			<div class="layui-inline">
            		  				    <label class="layui-form-label">jenkins</label>
                                  <div class="layui-input-inline">
                    	            		<select name="jenkins_id" lay-filter="jenkinsId" lay-search="" id="jenkinsId">
                    	              			<option value="" selected="">请选择</option>
                    	            		</select>
                                  </div>
                                  <div class="layui-form-mid layui-font-red">*</div>
                    			</div> 
              		</div>
              </div>	
            		<div class="layui-form-item" style="margin-bottom:2px">   
                      <label class="layui-form-label required">流水线ID</label>
                          <div class="layui-input-inline">
                              <input type="text" name="pipeline_id" autocomplete="off" placeholder="" class="layui-input">
                          </div>
                          <div class="layui-form-mid layui-font-red">*</div>  
            		</div>
                <div class="layui-form-mid layui-word-aux">
                  阿里云流水线ID:https://flow.aliyun.com/pipelines/2679891/current中的2679891<br>
                  jenkins流水线ID:job的名称
                </div> 	
                <div class="layui-form-item">
                      <button class="layui-btn" lay-submit="" lay-filter="updateSubmit">保存更改</button>
                </div>
        </form>         
    </div>
</div>
</body>
<script>

  var cicdName = getQueryString("cicdName");
    layui.use(['form', 'table'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table;

        form.on('radio(cicdType)', function (data) { 
            if(data.value == 1){
              $("#aliyunTpl").show();
              $("#jenkinsTpl").hide();
            }else {
              $("#aliyunTpl").hide();
              $("#jenkinsTpl").show();     
            }    
        });

        form.on('select(aliyunId)', function(data){
          console.log(data.value); //得到被选中的值
        	$.get('/cicd/v1/GetAliyunIdList?aliyun_id='+data.value, function (resp) {
              var orgids = JSON.parse(resp.data[0].organization_id);
              //console.log(orgids);
              $("#organizationId").empty();
          		$.each(orgids,function(i,item){
          			var html = '<option value="'+item.id+'">'+item.name+'</option>'	
          			$("#organizationId").append(html);
          		});
        	    form.render();
            });	
        }); 

        form.on('select(cluster_Id)', function(data){
          console.log(data.value); //得到被选中的值
      		$.get('/xkube/ns/v1/List?clusterId='+data.value, function (resp) {
              $("#name_Space").empty();
        			$.each(resp.data,function(i,item){
        				var html2 = '<option value="'+item.nameSpace+'">'+item.nameSpace+'</option>'
        				$("#name_Space").append(html2);
        			});
        			form.render();		
      	  });	
        });

      //deatail
			$.get('/cicd/v1/GetCicdInfo' + location.search, function (resp) {
				  if (resp.code == 0 ) { 
                $.get('/cicd/v1/GetPipelines?cicdId='+resp.data.id, function (resp2) {
                    var html2 = '<option value="'+resp.data.namespace+'">'+resp.data.namespace+'</option>'
        				    $("#name_Space").append(html2);
        				  form.val('UpdateInfo', {
        				    "id": resp.data.id
                    ,"cicd_name": resp.data.cicd_name
                    ,"appname": resp.data.appname
                  	,"cicd_type": resp.data.cicd_type
                  	,"cluster_id": resp.data.cluster_id
                  	,"namespace": resp.data.namespace
                  	,"aliyun_id": resp2.data.aliyun_id
                  	,"organization_id": resp2.data.organization_id
                  	,"jks_id": resp2.data.jks_id
                    ,"pipeline_id": resp2.data.pipeline_id
        				  });

                  if(resp.data.cicd_type == 1){
                    $("#aliyunTpl").show();
                    $("#jenkinsTpl").hide();
                  }else {
                    $("#aliyunTpl").hide();
                    $("#jenkinsTpl").show();     
                  } 

                	$.get('/xkube/cluster/v1/List', function (resp3) {
                  		$.each(resp3.data,function(i,item){
                  			if (item.cluster_id == resp.data.cluster_id) {
                  				var html = '<option value="'+item.cluster_id+'" selected="">'+item.cluster_name+'</option>'
                  			}else{
                  				var html = '<option value="'+item.cluster_id+'">'+item.cluster_name+'</option>'	
                  			}
                  			$("#cluster_Id").append(html);
                  		});	
                    form.render();
                  });
                  
              	  $.get('/cicd/v1/GetAliyunIdList', function (resp4) {
                		$.each(resp4.data,function(i,item){
                      if (resp2.data.aliyun_id == item.aliyun_id) {
                			  var html = '<option value="'+item.aliyun_id+'" selected="">'+item.aliyun_id+'</option>'	
                			}else{
                 			  var html = '<option value="'+item.aliyun_id+'">'+item.aliyun_id+'</option>'	                       
                      }                      
                      $("#aliyunId").append(html);
                        var orgids = JSON.parse(item.organization_id);
                        $.each(orgids,function(i,item){
                            if (resp2.data.organization_id == item.id ) {
                        			var html = '<option value="'+item.id+'" selected="">'+item.name+'</option>'	
                            }else{
                        			var html = '<option value="'+item.id+'">'+item.name+'</option>'	                              
                            }
                        		$("#organizationId").append(html);
                        });
                		});
              	    form.render();
                  });	 

              	  $.get('/cicd/v1/GetJksList', function (resp5) {
                		$.each(resp5.data,function(i,item){
                      if (resp2.data.jks_id == item.jks_id ) {
                			  var html = '<option value="'+item.jks_id+'" selected="">'+item.jks_id+'</option>'	
                      }else{
                			  var html = '<option value="'+item.jks_id+'">'+item.jks_id+'</option>'	                        
                      }
                			  $("#jenkinsId").append(html);
                		});
              	    form.render();	
                  });
                                   
                  //form.render();
                });                           
          }else{
              console.log(cicdName);
    				  form.val('UpdateInfo', {
                "cicd_name": cicdName
    				  });
          }
		  });

        //更新
        form.on('submit(updateSubmit)', function (data) {
                data.field.cicd_name = data.field.cicd_name.replace(/^\s*|\s*$/g,""); //替换空格
                data.field.appname = data.field.appname.replace(/^\s*|\s*$/g,"");
                data.field.pipeline_id = data.field.pipeline_id.replace(/^\s*|\s*$/g,"");
                data.field.cicd_type = parseInt(data.field.cicd_type);  
                data.field.id = parseInt(data.field.id);  
					      console.log(data.field);
			          layer.confirm('确定修改?', {icon: 3, title:'提示',yes: function(index){
                     var index2 = layer.load(0, {shade: false});
                     layer.msg('此处需运行3-5s左右');
                     $.ajax({
                       url: "/cicd/v1/Update" + location.search,
                       type: "POST",
                       data: JSON.stringify(data.field),
                       dataType: "json",
                       success: function (resp) {
                                layer.close(index2);
                                 if(resp.code == 0){
                                    layer.msg('修改成功', {icon: 1});
                                 }else{
                                    layer.msg(resp.msg,{icon:2});
                                 }
                        }
                      });		  	  
                  },
                  cancel: function(index, layero){ 
                    layer.close(index);
                    layer.close(index2);
		                console.log("不操作");
                  } 
                });
              return false;
        });

    });

</script>
</html>
