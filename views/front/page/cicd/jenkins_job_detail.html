<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>流水线详情</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/lib/layui-v2.13.3/css/layui.css" media="all">
    <link rel="stylesheet" href="/css/public.css" media="all">
    <script type="text/javascript" src="/js/jquery.min.js"></script>
    <script src="/lib/layui-v2.13.3/layui.js" charset="utf-8"></script>
    <script src="/js/xkube.js?v=1" charset="utf-8"></script>
    <script src="/js/lay-config.js?v=1.0.4" charset="utf-8"></script>
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">
            <blockquote class="layui-elem-quote layui-quote-nm">
              <span class="layui-text" id="createTime"></span>
              <span class="layui-text">&nbsp;&nbsp;|&nbsp;&nbsp;</span>
              <span class="layui-text" id="pipelineId"></span>
              <span class="layui-text">&nbsp;&nbsp;|&nbsp;&nbsp;</span>
              <span class="layui-text" id="pipelineRunId"></span>
              <span class="layui-text">&nbsp;&nbsp;|&nbsp;&nbsp;</span>
              <span class="layui-text" id="runTime"></span>
              <span class="layui-text">&nbsp;&nbsp;|&nbsp;&nbsp;状态:</span>
              <span id="status"></span>
              <div style="margin-top:15px;">
                <button class="layui-btn" id="RunJob">运行</button>
                <button class="layui-btn layui-btn-normal" id="Edit">编辑</button>
              </div>
            </blockquote>

            <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
              <ul class="layui-tab-title">
                <li class="layui-this">最近运行</li>
                <li>运行历史</li>
              </ul>
              <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                  <pre class="layui-code"><div id="logtext"></div></pre>
                </div>
                <div class="layui-tab-item">
                  <table class="layui-table" id="currentTableId" lay-filter="currentTableFilter"></table>  
                </div>
              </div>
            </div> 
            
    </div>
</div>
</body>
<script type="text/html" id="runIdTpl">
     <span style="color:#1E9FFF">#{{ d.id }}</span>
</script>	

<script type="text/html" id="statusTpl">
  {{# if (d.status == 'SUCCESS') { }}
    <span class="layui-font-green layui-font-16">成功</span>
  {{# } else if (d.status == 'RUNNING') { }}
    <span class="layui-font-orange layui-font-16">运行中</span>
	{{# } else { }}
    <span class="layui-font-red layui-font-16">{{ d.status }}</span>
{{# } }}
</script>	

<script type="text/html" id="currentTableBar">
    <a class="layui-btn layui-btn-normal layui-btn-sm" lay-event="logdetail">日志</a>
</script>

<script>

  var currentBuild = 0; //定义全局变量流水线的状态
  var lastRunTime = '';
  var cicdName = getQueryString("cicdName");

function getFormattedDateTime() {
  const now = new Date();
  
  // 获取各时间组件
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const seconds = String(now.getSeconds()).padStart(2, '0');

  // 组合成目标格式
  return `${year}-${month}-${day}T${hours}:${minutes}:${seconds}`;
}

  //转换状态显示
  function getStatus(status) {
    if (status == "SUCCESS"){
      return '<i class="layui-text layui-font-green layui-font-16">成功</i>';     
    }else if (status == ""){
      return '<i class="layui-text layui-font-orange layui-font-16">运行中</i>';
    }else if (status == "QUEUE"){
      return '<i class="layui-text layui-font-orange layui-font-16">等待中</i>';
    }else if (status == "FAIL"){
      return '<i class="layui-text layui-font-red layui-font-16">失败</i>';
    }else{
      return '<i class="layui-text layui-font-blue layui-font-16">'+status+'</i>';
    }
  }

  //状态提交
  function PostStatus(status,lastRunTime) {
    var state = 1;
    if (status == "SUCCESS"){
      state = 1;
    }else if (status == "RUNNING"){
      state = 2;
    }else if (status == "FAIL"){
      state = 3;
    }else{
      state = 1;
    }
       $.ajax({
         url: "/cicd/v1/PostStatus" + location.search+"&status="+state+"&lastRunTime="+lastRunTime,
         type: "GET",
         dataType: "json",
         success: function (resp) {
                   if(resp.code != 0){
                      //layer.msg('拒绝成功', {icon: 1});                    
		                  //window.location.reload();
                      console.log(resp);
                   }
          }
        });		  	  
  }

  function GetBuildState(currentBuild){
      $.ajax({
         url: "/cicd/jks/v1/BuildState"+location.search+"&buildId="+currentBuild,
         type: "GET",
         success: function (resp) {
              if (resp.code == 0) {
                var pipelineId = resp.data.id;
                var status = getStatus(resp.data.status);
                var buildTime = resp.data.buildTime;
                var pipelineRunId = resp.data.id;
                var duration = resp.data.duration;
              
              
                $('#pipelineId').html('流水线ID:'+cicdName);
                $('#createTime').html('创建时间:'+buildTime);
                $('#runTime').html('耗时:'+duration+'s');
                $('#pipelineRunId').html('运行ID:'+pipelineRunId);
                $('#status').html(status);

                $('#logtext').html(resp.data.log);
                window.scrollTo(0, document.body.scrollHeight); 
                if (status == 'SUCCESS') {
                  PostStatus('SUCCESS');
                  clearInterval(timer2);
                }
              }else{
                //layer.msg(resp.msg,{icon:1});
                $('#logtext').html("等待中...");
              }
          },
          fail:function(){
            $('#logtext').html("GetLogFail");
          }
       });    
  }

    layui.use(['form', 'table','miniTab','element','code'], function () {
        var $ = layui.jquery,
            form = layui.form,
            element = layui.element,
            table = layui.table;

        layui.code({
            title: '日志'
            ,skin: 'notepad' //如果要默认风格，不用设定该key。
        });

        //编辑
        $('#Edit').on("click",function(){
                layer.open({
                    title:'流水线编辑',
                    type: 2,
                    shade: 0.2,
                    maxmin:true,
                    shadeClose: true,
                    area: ['50%', '90%'],
                    content: '/page/cicd/pipelines_edit.html'+ location.search,
                });
        });

        //运行
        $('#RunJob').on("click",function(){
            var index2 = layer.load(0, {shade: false});
            $.ajax({
             url: "/cicd/jks/v1/Run" + location.search,
             type: "GET",
             dataType: "json",
             success: function (resp) {
                        layer.close(index2);
                        if(resp.code == 0){
                          currentBuild = resp.buildId;
                          PostStatus('RUNNING');
                          var status = getStatus("QUEUE")
                          var currentTime = getFormattedDateTime();
                          $('#status').html(status);
                          $('#runTime').html('耗时:0s');
                          $('#createTime').html('创建时间:'+currentTime);
                          $('#pipelineRunId').html('运行ID:'+currentBuild);
                          layer.msg('启动成功', {icon: 1,time:2000},function(){
                              //location.reload();
                              GetBuildState(currentBuild);
                          });                          
                        }else{     
                          layer.msg(resp.errorMessage,{icon:2});
                        }
              },
              fail:function(){
                layer.msg("调用启动失败,请重试!",{icon:2},function(){
                  layer.close(index2);
                });                
              }
            });		  	  
        });

        table.render({
            elem: '#currentTableId',
            url: '/cicd/jks/v1/BuildList' + location.search,
            cols: [[
                {field: 'id',width: 150, title: '构建ID',templet: '#runIdTpl', sort: true},
                {field: 'status',title: '状态',templet: '#statusTpl'},
                {field: 'buildTime', title: '开始时间'},
                {field: 'duration',title: '耗时'},
                {title: '操作', minWidth: 250, toolbar: '#currentTableBar', align: "center"}
            ]],
            limits: [25, 50, 100],
            limit: 25,
            page: false,          
        });

        table.on('tool(currentTableFilter)', function (obj) {
            var data = obj.data;
            if (obj.event === 'logdetail') {
                var index = layer.open({
                    title: '流水线日志',
                    type: 2,
                    shade: 0.2,
                    maxmin:true,
                    shadeClose: true,
                    area: ['80%', '80%'],
                    content: '/page/cicd/jenkins_log.html'+location.search+"&buildId="+data.id,
                });
                $(window).on("resize", function () {
                    layer.full(index);
                });
                return false;
            } else{               
                console.log("no");               
            }
        });
        
        var index2 = layer.load(0, {shade: false});
        $.ajax({
           url: "/cicd/jks/v1/BuildState"+location.search,
           type: "GET",
           success: function (resp) {
                if (resp.code == 0) {
                  var pipelineId = resp.data.id;
                  var status = getStatus(resp.data.status);
                  var buildTime = resp.data.buildTime;
                  var pipelineRunId = resp.data.id;
                  var duration = resp.data.duration;
                
                  $('#runTime').html('耗时:'+duration+'s');
                  $('#pipelineId').html('流水线ID:'+cicdName);
                  $('#createTime').html('创建时间:'+buildTime);
                  $('#pipelineRunId').html('运行ID:'+pipelineRunId);
                  $('#status').html(status);

                  $('#logtext').html(resp.data.log);
                  window.scrollTo(0, document.body.scrollHeight); 
                }else{
                  layer.msg(resp.msg,{icon:1});
                }
                layer.close(index2);	
            },
            fail:function(){
              layer.close(index2);	
            }
         });

      	const timer2 = setInterval(function () {
            if (currentBuild > 0 ){
              GetBuildState(currentBuild)
            }
      	},3000);	
    
        setTimeout(() => {
          clearInterval(timer2);
          console.log("Timer2 stop");
        }, 300000); //5分

    });
</script>
</html>
